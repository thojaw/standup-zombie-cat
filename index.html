<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombie Stand-Up Timer</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050506">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; font-family: system-ui, sans-serif;
  }
  canvas {
    width: min(100vw, calc(100vh * 1672 / 941)); aspect-ratio: 1672 / 941; display: block;
  }
  video { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #hint {
    position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #6b665c; font-size: 13px;
    transition: opacity 1s; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="view" width="1672" height="941"></canvas>
<div id="hint">Klick: Start / Neustart · Rechtsklick: Katze verstecken · B: Blitz · F: Vollbild</div>
<script src="cat.js"></script>
<script>
// ---- Settings -------------------------------------------------------------------------------
const CONFIG = {
  title: "Stand-Up Cat",  // shown instead of the timer while the cat hides
  talkSeconds: 50,        // time per speaker
  talkCutoff: 12,         // seconds left: no new happy/look moments, a happy cat returns to neutral
  notAmusedLead: 6,       // seconds left: head for "not amused", so it is there before the digits turn red
  angryAfter: 30,         // seconds of overtime until the cat gets angry
  redFullAfter: 30,       // seconds after turning angry until the red tint is at full strength
  redMax: 0.55,           // strength of the red tint
  rainAfter: 20,          // seconds of overtime until it starts to rain
  stormAfter: 60,         // seconds of overtime until random lightning starts
  stormGap: [4, 12],      // random pause between two storm flashes, in seconds
  hauntEvery: 2,          // the 1st lightning flash of a round and then every 2nd one shows the haunted scene
  hauntMs: [420, 560],    // the haunted details show this long during such a flash, then fade out
  scare: true,            // once per round, deep in overtime, the angry cat turns into a skull for a moment
  scareWindow: [115, 130],// seconds of overtime within which the skull scare happens (random each round)
  scareSize: 1.5,         // skull size relative to the cat
  scareHoldMs: 300,       // the skull's last frame stays this long before the cat is back
  flashDelay: 0,        // ms after "not amused -> angry" has finished until the lightning flash
  speed: 1.5,             // clip playback speed
  chainSpeed: 2,          // extra speed factor for multi-step mood changes and for calming down
  rewindRate: 60,         // timer seconds per real second when the timer spins back to 0:50
  moodSwapSeconds: [5, 9],// random interval for neutral/happy swaps while talking
  hiddenOffset: 175,      // px the cat sits lower while hidden (only ears and eyes peek out)
  riseSeconds: 2.8,       // how long the cat needs to climb up
  hideSeconds: 1.6,       // how long it needs to crawl back
};

// ---- Cat and scene (cat.js) -----------------------------------------------------------------
const cat = createCat({
  clipBase: "clips/",
  container: document.body,
  speed: CONFIG.speed,
  chainSpeed: CONFIG.chainSpeed,
  onTransitionEnd(from, to) {
    if (from === "notamused" && to === "angry") flash(performance.now() + CONFIG.flashDelay, 1);
  },
});
const setMood = m => cat.setMood(m);
const scene = createScene("scene/");
// Haunted details (evil moon, crow skeleton, glowing skull eyes), only visible during some flashes.
const haunt = new Image(); haunt.src = "scene/scene_haunt.png";
let talkBag = createBag(["happy", "look"]);
// Skull scare: half a second of the cat turning into a snarling skull (clip runs backwards from
// the original video). It interrupts the cat, which keeps playing unseen and is back afterwards.
const skull = document.createElement("video");
skull.src = "clips/skull_scare.webm";
skull.muted = true;
skull.playsInline = true;
skull.preload = "auto";
document.body.appendChild(skull);
let scareAt = null;          // overtime (negative seconds) of this round's scare; null once it happened
let scareStart = -Infinity;
let scareFlickered = false;
const bobOffset = createBob();
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

// A tweened value: moves from its current value to a new one with cubic ease-in-out.
function tween(value) {
  return { from: value, to: value, start: 0, dur: 1 };
}
function tweenTo(t, to, seconds, now) {
  t.from = tweenValue(t, now);
  t.to = to;
  t.start = now;
  t.dur = seconds * 1000;
}
function tweenValue(t, now) {
  const p = Math.min(1, Math.max(0, (now - t.start) / t.dur));
  return t.from + (t.to - t.from) * easeInOutCubic(p);
}

const lift = tween(CONFIG.hiddenOffset);   // extra y offset: hidden = low, active = 0
const bobAmount = tween(0.25);             // bobbing strength: subtle while hidden
let red = 0;                               // current red tint, eased towards its target

// ---- Timer state ----------------------------------------------------------------------------
// hidden: cat in the hole, timer stands at 0:50. running: timer counts down and into overtime.
// rewinding: after a restart the timer spins back up to 0:50, then starts running again.
let phase = "hidden";
let startedAt = 0;
let nextSwap = 0;
let rewind = null;       // { from, start, dur, then } while the timer spins back

function remaining(now) {
  if (rewind) {
    const p = Math.min(1, (now - rewind.start) / rewind.dur);
    return rewind.from + (CONFIG.talkSeconds - rewind.from) * p;
  }
  return phase === "running" ? CONFIG.talkSeconds - (now - startedAt) / 1000 : CONFIG.talkSeconds;
}

function spinBack(now, then) {
  const from = remaining(now);
  const dur = Math.max(300, (CONFIG.talkSeconds - from) / CONFIG.rewindRate * 1000);
  rewind = { from, start: now, dur, then };
}

function updateRewind(now) {
  if (!rewind || now - rewind.start < rewind.dur) return;
  const then = rewind.then;
  rewind = null;
  if (then === "running") {
    phase = "running";
    startedAt = now;
    nextSwap = now + randomSwap();
  }
}

function format(rem) {
  // 0:01 -> 0:00 -> -0:01: the "0:00" second lies right after zero.
  const s = rem > 0 ? Math.ceil(rem) : -Math.floor(-rem);
  const abs = Math.abs(s);
  return `${s < 0 ? "-" : ""}${Math.floor(abs / 60)}:${String(abs % 60).padStart(2, "0")}`;
}

function start(now) {
  // Every round (= speaker) starts fresh: both talk variants come up, the first flash is haunted.
  talkBag = createBag(["happy", "look"]);
  flashCount = 0;
  const [sa, sb] = CONFIG.scareWindow;
  scareAt = -(sa + Math.random() * (sb - sa));
  if (phase === "hidden") {
    rewind = null;
    tweenTo(lift, 0, CONFIG.riseSeconds, now);
    tweenTo(bobAmount, 1, CONFIG.riseSeconds, now);
    setMood("neutral");
    phase = "running";
    startedAt = now;
    nextSwap = now + randomSwap();
  } else {
    // Restart: the cat calms down in a hurry while the timer spins back to 0:50.
    cat.hurryTo("happy");
    spinBack(now, "running");
    phase = "rewinding";
  }
}

function hide(now) {
  if (phase === "hidden") return;
  spinBack(now, "hidden");
  phase = "hidden";
  tweenTo(lift, CONFIG.hiddenOffset, CONFIG.hideSeconds, now);
  tweenTo(bobAmount, 0.25, CONFIG.hideSeconds, now);
  cat.hurryTo("neutral");
}

function randomSwap() {
  const [a, b] = CONFIG.moodSwapSeconds;
  return (a + Math.random() * (b - a)) * 1000;
}

function updateMood(now) {
  if (phase !== "running") return;
  const rem = remaining(now);
  // A mood change waits for the running clip (up to ~2.7 s) and happy -> not amused passes neutral,
  // so the cat has to leave happy well before 0:00 to show no happy face once the digits turn red.
  if (rem <= -CONFIG.angryAfter) setMood("angry");
  else if (rem <= CONFIG.notAmusedLead) setMood("notamused");
  else if (rem <= CONFIG.talkCutoff) { if (cat.target === "happy") setMood("neutral"); }
  else if (now >= nextSwap) {
    // Talking time: from happy back to neutral; from neutral either to happy or a look around.
    // The bag alternates both in random order, so within 50 s each shows up at least once.
    if (cat.target === "happy") setMood("neutral");
    else if (talkBag() === "happy") setMood("happy");
    else cat.playOnce("neutral_look");
    nextSwap = now + randomSwap();
  }
}

// ---- Lightning ------------------------------------------------------------------------------
// A double flicker like a real lightning strike, then a short afterglow. [ms, brightness]
const FLASH = [[0, 0], [30, 0.85], [90, 0.15], [150, 1], [260, 0.45], [700, 0]];
let flashAt = -Infinity;
let flashPower = 1;
let nextStorm = null;    // time of the next random storm flash, null while the storm is off

function flashLevel(now) {
  const t = now - flashAt;
  if (t < 0 || t >= FLASH[FLASH.length - 1][0]) return 0;
  for (let i = 1; i < FLASH.length; i++) {
    const [t1, v1] = FLASH[i];
    if (t < t1) {
      const [t0, v0] = FLASH[i - 1];
      return (v0 + (v1 - v0) * (t - t0) / (t1 - t0)) * flashPower;
    }
  }
  return 0;
}

let flashCount = 0;      // flashes in this round
let flashHaunted = false;

// mode "count": a regular flash, every hauntEvery-th one of a round is haunted.
// "haunted" / "plain": always or never haunted, and not counted (used by the skull scare).
function flash(now, power, mode = "count") {
  flashAt = now;
  flashPower = power;
  if (mode === "count") {
    flashCount++;
    flashHaunted = (flashCount - 1) % CONFIG.hauntEvery === 0;
  } else {
    flashHaunted = mode === "haunted";
  }
}

const scareMs = () => (skull.duration || 0.5) * 1000 + CONFIG.scareHoldMs;
const scareShowing = now => now - scareStart < scareMs();

// Deep in overtime, once per round: a haunted flash, and the angry cat is a snarling skull for a
// moment. A second, weaker flicker covers the cat's return.
function updateScare(now, rem) {
  if (scareShowing(now)) {
    if (!scareFlickered && now - scareStart >= scareMs() - 120) {
      scareFlickered = true;
      flash(now, 0.7, "plain");
    }
    return;
  }
  if (!CONFIG.scare || scareAt === null || phase !== "running" || rem > scareAt || cat.mood !== "angry") return;
  scareAt = null;
  scareStart = now;
  scareFlickered = false;
  skull.currentTime = 0;
  skull.play().catch(() => {});
  flash(now, 1, "haunted");
}

function drawSkull(now, yOffset) {
  // While the restart seek is running the element may still show last round's final frame.
  if (!scareShowing(now) || skull.readyState < 2 || skull.seeking) return;
  // Centred on the cat's head and scaled up; the skull has no body, so it may rise over the rim.
  const c = SCENE.cat;
  const size = c.size * CONFIG.scareSize;
  const headX = c.x + c.size / 2;
  const headY = c.y + yOffset + c.size * 0.47;
  ctx.drawImage(skull, headX - size / 2, headY - size * 0.47, size, size);
}

// The haunted details stay while the light flickers and vanish in the afterglow, so the viewer is
// left wondering what they just saw.
function hauntLevel(now) {
  if (!flashHaunted) return 0;
  const t = now - flashAt;
  const [hold, end] = CONFIG.hauntMs;
  if (t < 0 || t >= end) return 0;
  return t < hold ? 1 : 1 - (t - hold) / (end - hold);
}

// From stormAfter seconds of overtime on, lightning strikes at random, with random strength.
function updateStorm(now, rem) {
  if (phase !== "running" || rem > -CONFIG.stormAfter) { nextStorm = null; return; }
  const [a, b] = CONFIG.stormGap;
  if (nextStorm === null) nextStorm = now + (1 + Math.random() * 3) * 1000;
  if (now < nextStorm) return;
  flash(now, 0.5 + Math.random() * 0.5);
  nextStorm = now + (a + Math.random() * (b - a)) * 1000;
}

// ---- Rain -----------------------------------------------------------------------------------
// Thin slanted streaks falling over the whole picture; how many are visible follows rainLevel.
const RAIN = { drops: 320, speed: 1500, slant: 0.4, alpha: 0.32 };
const drops = Array.from({ length: RAIN.drops }, () => ({
  x: Math.random() * 1672 * (1 + RAIN.slant) - 941 * RAIN.slant,
  y: Math.random() * 941,
  len: 18 + Math.random() * 26,
  speed: 0.75 + Math.random() * 0.5,
}));
let rainLevel = 0;
let lastFrame = 0;

function drawRain(now, rem) {
  const dt = Math.min(50, now - (lastFrame || now)) / 1000;
  lastFrame = now;
  const rainTarget = phase === "running" && rem <= -CONFIG.rainAfter ? 1 : 0;
  rainLevel += (rainTarget - rainLevel) * 0.02;
  if (rainLevel < 0.01) return;

  const count = Math.round(drops.length * rainLevel);
  ctx.strokeStyle = `rgba(205, 215, 235, ${RAIN.alpha * Math.min(1, rainLevel * 1.5)})`;
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";
  ctx.beginPath();
  for (let i = 0; i < count; i++) {
    const d = drops[i];
    const step = RAIN.speed * d.speed * dt;
    d.y += step;
    d.x += step * RAIN.slant;
    if (d.y - d.len > 941) {
      d.y = -d.len - Math.random() * 100;
      d.x = Math.random() * 1672 * (1 + RAIN.slant) - 941 * RAIN.slant;
    }
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.len * RAIN.slant, d.y - d.len);
  }
  ctx.stroke();
}

// ---- Rendering ------------------------------------------------------------------------------
function draw(now) {
  updateRewind(now);
  updateMood(now);

  scene.updateCat(cat.frame());

  if (scene.ready) {
    const catY = tweenValue(lift, now) + bobOffset(now) * tweenValue(bobAmount, now);
    updateScare(now, remaining(now));
    scene.draw(ctx, catY, !scareShowing(now));
    const h = hauntLevel(now);
    if (h > 0 && haunt.complete) {
      ctx.globalAlpha = h;
      ctx.drawImage(haunt, 0, 0);
      ctx.globalAlpha = 1;
    }
    drawSkull(now, catY);

    // Red tint follows the overtime, so it also fades while the timer spins back.
    const rem = remaining(now);
    const redTarget = Math.min(1, Math.max(0, (-rem - CONFIG.angryAfter) / CONFIG.redFullAfter)) * CONFIG.redMax;
    red += (redTarget - red) * 0.04;
    if (red > 0.002) {
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = `rgba(255, 40, 20, ${red})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "source-over";
    }

    drawRain(now, rem);
    updateStorm(now, rem);

    const f = flashLevel(now);
    if (f > 0) {
      ctx.globalCompositeOperation = "screen";
      ctx.fillStyle = `rgba(235, 240, 255, ${f})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "source-over";
    }

    drawTimer(rem);
  }
  requestAnimationFrame(draw);
}

function drawTimer(rem) {
  // While the cat hides (and the timer has finished spinning back), the title stands in for the timer.
  const title = phase === "hidden" && !rewind;
  const text = title ? CONFIG.title : format(rem);
  const over = !title && rem <= 0;
  ctx.font = "212px Creepster, 'Chiller', fantasy";
  // The title is longer than the timer: shrink it so it stays clear of the moon.
  const scale = title ? Math.min(1, 640 / ctx.measureText(text).width) : 1;
  if (scale < 1) ctx.font = `${Math.round(212 * scale)}px Creepster, 'Chiller', fantasy`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.lineJoin = "round";
  // Overtime: heavier outline and a dark halo so the red digits stay readable on the red-tinted sky.
  ctx.lineWidth = (over ? 27 : 18) * scale;
  ctx.strokeStyle = "rgba(10, 4, 2, 0.95)";
  ctx.shadowColor = "rgba(0, 0, 0, 0.8)";
  ctx.shadowBlur = over ? 50 : 0;
  ctx.strokeText(text, 836, 360);
  ctx.shadowBlur = 0;
  ctx.fillStyle = over ? "#ff5a2e" : "#f2dca8";
  ctx.fillText(text, 836, 360);
}

// ---- Input ----------------------------------------------------------------------------------
document.addEventListener("click", () => start(performance.now()));
document.addEventListener("contextmenu", e => { e.preventDefault(); hide(performance.now()); });
document.addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  // Lightning on demand; it counts like any other flash, so every second one is haunted.
  if ((e.key === "b" || e.key === "B") && !e.repeat) flash(performance.now(), 1);
});
setTimeout(() => { document.getElementById("hint").style.opacity = 0; }, 6000);

// ?scare=0 switches the skull scare off.
if (new URLSearchParams(location.search).get("scare") === "0") CONFIG.scare = false;

// Scripting hook for testing or remote control.
window.standupCat = {
  start: () => start(performance.now()),
  hide: () => hide(performance.now()),
  get state() { return { phase, mood: cat.mood, target: cat.target, clip: cat.clip, remaining: remaining(performance.now()) }; },
  config: CONFIG,
};

// Canvas text does not trigger web font loading by itself.
document.fonts.load("212px Creepster").catch(() => {});

requestAnimationFrame(draw);
</script>
</body>
</html>
